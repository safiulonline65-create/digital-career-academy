<script type="module">
// STEP 1: Supabase Configuration
const SUPABASE_URL = 'https://wjgiiftctqpkmlcjmand.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gmNQhbzzHz6x0aK_nKPPDA_7rwaPWGZ';

let db = null;
let currentUser = null;
let currentProfile = null;
let allCourses = [];

// Supabase connection
const configured =
  SUPABASE_URL.startsWith('https://') &&
  SUPABASE_ANON_KEY.length > 30 &&
  !SUPABASE_ANON_KEY.includes('PASTE_');

if (configured) {
  db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// Status message
function status(id, msg, type = '') {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'status ' + type;
}

// Phone number helpers
function normalizePhone(p) {
  return p.trim().replace(/[^\d+]/g, '');
}

function mobileLoginEmail(phone) {
  return phone.replace(/\D/g, '') +
    '@login.digitalcareeracademy.com';
}

// Authentication modal
window.openAuth = (mode = 'login') => {
  document.getElementById('authModal').classList.add('show');
  setAuthMode(mode);
};

window.closeAuth = () => {
  document.getElementById('authModal').classList.remove('show');
};

window.setAuthMode = (mode) => {
  document.getElementById('authTitle').textContent =
    mode === 'signup' ? 'Student Registration' :
    mode === 'admin' ? 'Admin Login' : 'Student Login';

  document.getElementById('loginForm').hidden =
    mode === 'signup';

  document.getElementById('signupForm').hidden =
    mode !== 'signup';
};

window.showHome = () => {
  document.getElementById('home').style.display = '';
  document.getElementById('dashboard').style.display = 'none';
  window.scrollTo(0, 0);
};

window.enrollCourse = (id) => {
  document.getElementById('sCourse').value = String(id);
  openAuth('signup');
};

// Logout
window.logout = async () => {
  try {
    if (db) {
      const { error } = await db.auth.signOut({ scope: 'local' });
      if (error) throw error;
    }

    currentUser = null;
    currentProfile = null;

    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('home').style.display = 'block';

    closeAuth();
    window.scrollTo(0, 0);

  } catch (error) {
    alert('Logout হয়নি: ' + error.message);
  }
};

// Student Registration
window.signup = async () => {
  if (!db) {
    status('signupStatus', 'Supabase সেটিংস পরীক্ষা করুন।', 'err');
    return;
  }

  const name = sName.value.trim();
  const father = sFather.value.trim();
  const address = sAddress.value.trim();
  const phone = normalizePhone(sPhone.value);
  const email = sEmail.value.trim() || null;
  const qual = sQual.value.trim();
  const course = Number(sCourse.value);
  const password = sPassword.value;

  if (!name || !father || !address || !phone ||
      !qual || !course || password.length < 8) {
    status(
      'signupStatus',
      'সব * দেওয়া তথ্য পূরণ করুন। Password কমপক্ষে ৮ অক্ষরের হতে হবে।',
      'err'
    );
    return;
  }

  if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
    status(
      'signupStatus',
      'মোবাইল নম্বর Country Code-সহ লিখুন। যেমন +918001234567',
      'err'
    );
    return;
  }

  status('signupStatus', 'অ্যাকাউন্ট তৈরি হচ্ছে...');

  const loginEmail = mobileLoginEmail(phone);

  const { data, error } = await db.auth.signUp({
    email: loginEmail,
    password: password,
    options: {
      data: {
        full_name: name,
        father_name: father,
        address: address,
        mobile: phone,
        contact_email: email,
        qualification: qual
      }
    }
  });

  if (error) {
    status('signupStatus', error.message, 'err');
    return;
  }

  if (data.user) {
    if (data.session) {
      const { error: profileError } = await db
        .from('profiles')
        .upsert({
          id: data.user.id,
          full_name: name,
          father_name: father,
          address: address,
          mobile: phone,
          email: email,
          qualification: qual,
          role: 'student'
        });

      if (profileError) {
        status('signupStatus', profileError.message, 'err');
        return;
      }

      const { error: enErr } = await db
        .from('enrollments')
        .insert({
          student_id: data.user.id,
          course_id: course,
          status: 'pending'
        });

      if (enErr) {
        status('signupStatus', enErr.message, 'err');
        return;
      }

      await loadSession(data.user);
      closeAuth();
      return;
    }

    status(
      'signupStatus',
      'অ্যাকাউন্ট তৈরি হয়েছে। Email Confirmation বন্ধ করে আবার Login করুন।',
      'err'
    );
  }
};

// Student and Admin Login
window.login = async () => {
  if (!db) {
    status('loginStatus', 'Supabase সেটিংস পরীক্ষা করুন।', 'err');
    return;
  }

  const phone = normalizePhone(loginPhone.value);
  const password = loginPassword.value;

  if (!phone || !password) {
    status('loginStatus', 'মোবাইল নম্বর ও Password লিখুন।', 'err');
    return;
  }

  status('loginStatus', 'Login হচ্ছে...');

  const { data, error } = await db.auth.signInWithPassword({
    email: mobileLoginEmail(phone),
    password: password
  });

  if (error) {
    status('loginStatus', error.message, 'err');
    return;
  }

  const { data: profile, error: profileError } = await db
    .from('profiles')
    .select('role')
    .eq('id', data.user.id)
    .maybeSingle();

  const adminLogin =
    document.getElementById('authTitle').textContent === 'Admin Login';

  if (profileError || !profile) {
    await db.auth.signOut({ scope: 'local' });
    status('loginStatus', 'Profile পাওয়া যায়নি।', 'err');
    return;
  }

  if (adminLogin && profile.role !== 'admin') {
    await db.auth.signOut({ scope: 'local' });
    status('loginStatus', 'এটি Admin Account নয়।', 'err');
    return;
  }

  if (!adminLogin && profile.role === 'admin') {
    await db.auth.signOut({ scope: 'local' });
    status('loginStatus', 'Admin Login বাটন ব্যবহার করুন।', 'err');
    return;
  }

  await loadSession(data.user);
  closeAuth();
};

// Load user session
async function loadSession(user) {
  currentUser = user;

  let { data: profile, error } = await db
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .maybeSingle();

  if (error) {
    console.error('Profile error:', error);
    return;
  }

  if (!profile) {
    const m = user.user_metadata || {};

    const { data: newProfile, error: insertError } = await db
      .from('profiles')
      .insert({
        id: user.id,
        full_name: m.full_name || '',
        father_name: m.father_name || '',
        address: m.address || '',
        mobile: user.phone || m.mobile || '',
        email: m.contact_email || '',
        qualification: m.qualification || '',
        role: 'student'
      })
      .select()
      .single();

    if (insertError) {
      console.error('Profile creation error:', insertError);
      return;
    }

    profile = newProfile;
  }

  currentProfile = profile;

  document.getElementById('home').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  window.scrollTo(0, 0);

  document.getElementById('welcome').textContent =
    'স্বাগতম, ' + (profile.full_name || 'Student');

  document.getElementById('userPhone').textContent =
    user.phone || user.user_metadata?.mobile || '';

  document.getElementById('adminTab').style.display =
    profile.role === 'admin' ? 'block' : 'none';

  await refreshDashboard();
}

// Refresh dashboard
async function refreshDashboard() {
  const { data: enrs = [], error } = await db
    .from('enrollments')
    .select('id,status,created_at,courses(id,name,duration,offer_fee)')
    .eq('student_id', currentUser.id)
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Enrollment error:', error);
    return;
  }

  document.getElementById('countCourses').textContent = enrs.length;

  document.getElementById('countApproved').textContent =
    enrs.filter(x => x.status === 'approved').length;

  document.getElementById('enrollmentList').innerHTML = enrs.length
    ? `<div class="tableWrap"><table><thead><tr>
        <th>Course</th><th>Fee</th><th>Status</th>
       </tr></thead><tbody>
       ${enrs.map(x => `<tr>
         <td>${esc(x.courses?.name || 'Course')}</td>
         <td>₹${x.courses?.offer_fee ?? '—'}</td>
         <td><span class="pill ${x.status === 'approved' ? 'approved' : ''}">
           ${esc(x.status)}
         </span></td>
       </tr>`).join('')}
       </tbody></table></div>`
    : '<div class="empty">এখনও কোনো কোর্সে আবেদন করেননি।</div>';

  const approved = enrs
    .filter(x => x.status === 'approved' && x.courses?.id)
    .map(x => x.courses.id);

  let links = [];

  if (approved.length) {
    const { data } = await db
      .from('class_links')
      .select('course_id,live_class_url,recording_url,courses(name)')
      .in('course_id', approved);

    links = data || [];
  }

  document.getElementById('classList').innerHTML = links.length
    ? links.map(x => `<div class="feature" style="margin-bottom:12px">
        <b>${esc(x.courses?.name || 'Course')}</b>
        <p>${x.live_class_url
          ? `<a target="_blank" rel="noopener" href="${safeUrl(x.live_class_url)}">🔴 Join Live Class</a>`
          : 'Live class link not added yet'}</p>
        <p>${x.recording_url
          ? `<a target="_blank" rel="noopener" href="${safeUrl(x.recording_url)}">▶ Watch Recording</a>`
          : 'Recording not added yet'}</p>
       </div>`).join('')
    : '<div class="empty">অনুমোদিত কোর্সের ক্লাস লিংক এখানে দেখা যাবে।</div>';

  document.getElementById('profileDetails').innerHTML =
    `<p><b>Name:</b> ${esc(currentProfile?.full_name || '')}</p>
     <p><b>Father:</b> ${esc(currentProfile?.father_name || '')}</p>
     <p><b>Mobile:</b> ${esc(currentProfile?.mobile || currentUser.phone || '')}</p>
     <p><b>Email:</b> ${esc(currentProfile?.email || '—')}</p>
     <p><b>Address:</b> ${esc(currentProfile?.address || '')}</p>
     <p><b>Qualification:</b> ${esc(currentProfile?.qualification || '')}</p>`;

  if (currentProfile?.role === 'admin') {
    await loadAdmin();
  }
}

// Admin dashboard

        <th>Fee</th><th>Status / Action</th>
       </tr></thead><tbody>
       ${enrs.map(x => `<tr>
         <td>${esc(x.profiles?.full_name || '')}</td>
         <td>${esc(x.profiles?.mobile || '')}</td>
         <td>${esc(x.courses?.name || '')}</td>
         <td>₹${x.courses?.offer_fee ?? ''}</td>
         <td>
           <span class="pill ${x.status === 'approved' ? 'approved' : ''}">
             ${esc(x.status)}
           </span>
           <button class="btn light" style="padding:6px 9px"
             onclick="setEnrollment(${x.id},'approved')">Approve</button>
           <button class="btn outline" style="padding:6px 9px"

         </td>
       </tr>`).join('')}
       </tbody></table></div>`
    : '<div class="empty">কোনো আবেদন নেই।</div>';

  const { data: courses = [] } = await db

    .select('id,name')
    .eq('active', true);

  document.getElementById('classCourse').innerHTML =
    courses.map(c =>
      `<option value="${c.id}">${esc(c.name)}</option>`
    ).join('');
}

// Approve or reject enrollment
window.setEnrollment = async (id, statusValue) => {
  const { error } = await db
    .from('enrollments')
    .update({ status: statusValue })
    .eq('id', id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadAdmin();
  await refreshDashboard();
};

// Dashboard tabs
window.switchTab = (tab, btn) => {
  document.querySelectorAll('[id^="tab-"]').forEach(x => {
    x.hidden = true;
  });

  document.getElementById('tab-' + tab).hidden = false;

  document.querySelectorAll('.side button').forEach(x => {
    x.classList.remove('active');
  });

  btn.classList.add('active');
};

// HTML safety helpers
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function safeUrl(s) {
  try {
    const u = new URL(s);
    return u.protocol === 'https:' ? u.href : '#';
  } catch {
    return '#';
  }
}

// Initialize website
document.getElementById('year').textContent =
  new Date().getFullYear();

if (configured) {
  try {
    const { data: { session } } = await db.auth.getSession();

    if (session) {
      await loadSession(session.user);
    }

    db.auth.onAuthStateChange((_event, session) => {
      if (session) {
        loadSession(session.user);
      }
    });

  } catch (error) {
    console.error('Supabase initialization error:', error);
  }
} else {
  console.info('Add Supabase URL and publishable key in index.html.');
}
